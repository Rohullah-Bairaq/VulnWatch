[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnwatch"
version = "0.1.0"
description = "A beginner-friendly vulnerability management platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "PySide6",
]

[tool.setuptools.packages.find]
where = ["src"]
